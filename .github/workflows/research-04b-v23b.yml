name: research-04b-v23b

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-04b-v23b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  SECRET_KEY: ci-research-only-synthetic-key-04b-v23b

jobs:
  transfer-plan-v23b:
    if: github.head_ref == 'agent/bot-2.0-04b23b-orderflow-transfer-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert v23b locks
        run: |
          python - <<'PY'
          from backend.economia.protocolo_orderflow_v23b import (
              DESARROLLO_2026_ABIERTO_V23B,
              TEST_MAY_JUL_ABIERTO_V23B,
              IMPUTACION_PERMITIDA_V23B,
              USA_RETORNOS_V23B,
              USA_CONTENIDO_TRADES_V23B,
              USA_GPT_V23B,
              N_FECHAS_OBJETIVO_V23B,
              N_ARCHIVOS_OBJETIVO_V23B,
              PRESUPUESTO_CI_GIB_V23B,
              MIN_SIMBOLOS_POR_FECHA_V23B,
          )
          assert DESARROLLO_2026_ABIERTO_V23B is False
          assert TEST_MAY_JUL_ABIERTO_V23B is False
          assert IMPUTACION_PERMITIDA_V23B is False
          assert USA_RETORNOS_V23B is False
          assert USA_CONTENIDO_TRADES_V23B is False
          assert USA_GPT_V23B is False
          assert N_FECHAS_OBJETIVO_V23B == 96
          assert N_ARCHIVOS_OBJETIVO_V23B == 1920
          assert PRESUPUESTO_CI_GIB_V23B == 15
          assert MIN_SIMBOLOS_POR_FECHA_V23B == 15
          print('v23b transfer locks OK')
          PY

      - name: Run v23b S3 transfer inventory
        run: python scripts/run_orderflow_transfer_v23b.py

      - name: Upload v23b transfer plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-transfer-plan-v23b-2022-2025
          path: artifacts/orderflow-transfer-plan-v23b-2022-2025.json
          if-no-files-found: error
          retention-days: 7
