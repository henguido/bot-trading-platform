name: research-04e3

on:
  push:
    branches:
      - agent/bot-2.0-04e3-public-yield-source-audit
  pull_request:
    branches:
      - main

jobs:
  public-yield-source-audit-04e3:
    if: github.head_ref == 'agent/bot-2.0-04e3-public-yield-source-audit' || github.ref == 'refs/heads/agent/bot-2.0-04e3-public-yield-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ''
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      SECRET_KEY: ci-research-only-synthetic-key-04e3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert 04E-3 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from backend.economia.protocolo_fuentes_yield_04e3 import (
              ANIOS_04E3, OPTIONS_EOH_PREFIX_04E3, MIN_DIAS_OPTIONS_POR_ANIO_04E3,
              PNL_PERMITIDO_04E3, DESCARGAR_CONTENIDO_OPTIONS_PERMITIDO_04E3,
              CREDENCIALES_PERMITIDAS_04E3, PAPER_OPERATIVO_PERMITIDO_04E3,
              LIVE_PERMITIDO_04E3, RENDER_PERMITIDO_04E3,
              DESARROLLO_2026_ABIERTO_04E3, IMPUTACION_YIELD_PERMITIDA_04E3,
              USAR_PRECIO_SECUNDARIO_COMO_YIELD_PERMITIDO_04E3,
          )
          assert ANIOS_04E3 == (2022, 2023, 2024, 2025)
          assert OPTIONS_EOH_PREFIX_04E3 == 'data/option/daily/EOHSummary/'
          assert MIN_DIAS_OPTIONS_POR_ANIO_04E3 == 350
          assert PNL_PERMITIDO_04E3 is False
          assert DESCARGAR_CONTENIDO_OPTIONS_PERMITIDO_04E3 is False
          assert CREDENCIALES_PERMITIDAS_04E3 is False
          assert PAPER_OPERATIVO_PERMITIDO_04E3 is False
          assert LIVE_PERMITIDO_04E3 is False
          assert RENDER_PERMITIDO_04E3 is False
          assert DESARROLLO_2026_ABIERTO_04E3 is False
          assert IMPUTACION_YIELD_PERMITIDA_04E3 is False
          assert USAR_PRECIO_SECUNDARIO_COMO_YIELD_PERMITIDO_04E3 is False
          print('04E-3 methodology locks OK')
          PY
          grep -q 'PREDECLARADO ANTES DEL INVENTARIO S3 REAL' docs/investigacion/04E-3-fuentes-yield-publicas.md
          grep -q '2026 cerrado' docs/investigacion/04E-3-fuentes-yield-publicas.md

      - name: Unit tests 04E-3
        run: pytest -q tests/test_auditoria_fuentes_yield_04e3.py

      - name: Run public yield-source audit
        run: |
          python scripts/run_public_yield_source_audit_04e3.py
          grep -q '"pnl_calculated": false' artifacts/public-yield-source-audit-04e3.json
          grep -q '"option_content_downloaded": false' artifacts/public-yield-source-audit-04e3.json
          grep -q '"credentials_used": false' artifacts/public-yield-source-audit-04e3.json

      - name: Upload 04E-3 result
        uses: actions/upload-artifact@v4
        with:
          name: public-yield-source-audit-04e3
          path: artifacts/public-yield-source-audit-04e3.json
          retention-days: 14
