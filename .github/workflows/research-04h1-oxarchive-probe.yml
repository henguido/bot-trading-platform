name: research-04h1-oxarchive-probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/protocolo_crossvenue_carry_04h1.py'
      - 'backend/economia/fuente_0xarchive_04h1.py'
      - 'tests/test_protocolo_crossvenue_carry_04h1.py'
      - 'tests/test_fuente_0xarchive_04h1.py'
      - 'scripts/run_0xarchive_probe_04h1.py'
      - '.github/workflows/research-04h1-oxarchive-probe.yml'

permissions:
  contents: read

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ''
  BINANCE_API_KEY: ''
  BINANCE_API_SECRET: ''
  SECRET_KEY: ci-research-only-synthetic-key-04h1
  OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}

jobs:
  validate-04h1-data-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert research locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from backend.economia.protocolo_crossvenue_carry_04h1 import *
          assert ACTIVOS_04H1 == ('BTC','ETH','SOL')
          assert ANIOS_04H1 == (2024, 2025)
          assert DIRECCION_04H1 == 'LONG_BINANCE_SHORT_HYPERLIQUID'
          assert CREDENCIALES_TRADING_PERMITIDAS_04H1 is False
          assert API_KEY_DATOS_0XARCHIVE_PERMITIDA_04H1 is True
          assert PAPER_OPERATIVO_PERMITIDO_04H1 is False
          assert LIVE_PERMITIDO_04H1 is False
          assert RENDER_PERMITIDO_04H1 is False
          assert DESARROLLO_2026_ABIERTO_04H1 is False
          assert CALCULAR_PNL_2024_2025_PERMITIDO_04H1 is False
          print('04H-1 locks OK; PNL remains disabled')
          PY

      - name: Unit tests 04H-1 data source
        run: pytest -q tests/test_protocolo_crossvenue_carry_04h1.py tests/test_fuente_0xarchive_04h1.py

      - name: Probe 0xArchive historical mark/oracle
        if: env.OXARCHIVE_API_KEY != ''
        run: python scripts/run_0xarchive_probe_04h1.py

      - name: Explain missing market-data key
        if: env.OXARCHIVE_API_KEY == ''
        run: echo 'OXARCHIVE_API_KEY repository secret not configured; live probe skipped.'

      - name: Upload probe artifact
        if: env.OXARCHIVE_API_KEY != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: oxarchive-probe-04h1
          path: artifacts/oxarchive-probe-04h1.json
          if-no-files-found: warn
          retention-days: 14
