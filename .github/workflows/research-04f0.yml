name: research-04f0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/economia/protocolo_low_vol_04f0.py'
      - 'backend/economia/auditoria_low_vol_04f0.py'
      - 'scripts/run_low_vol_audit_04f0.py'
      - 'tests/test_auditoria_low_vol_04f0.py'
      - 'docs/investigacion/04F-0-low-volatility-datos.md'
      - '.github/workflows/research-04f0.yml'

permissions:
  contents: read

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ''
  BINANCE_API_KEY: ''
  BINANCE_API_SECRET: ''
  SECRET_KEY: ci-research-only-synthetic-key-04f0

jobs:
  low-vol-data-audit-04f0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert 04F-0 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from backend.economia.protocolo_low_vol_04f0 import (
              ANIOS_04F0, MESES_FORMACION_VOL_04F0, MESES_HOLD_04F0,
              MIN_SIMBOLOS_POR_HOLD_04F0, PNL_PERMITIDO_04F0,
              DESCARGAR_CONTENIDO_KLINES_PERMITIDO_04F0,
              USAR_EXCHANGE_INFO_ACTUAL_COMO_UNIVERSO_04F0,
              CREDENCIALES_PERMITIDAS_04F0, PAPER_OPERATIVO_PERMITIDO_04F0,
              LIVE_PERMITIDO_04F0, RENDER_PERMITIDO_04F0,
              DESARROLLO_2026_ABIERTO_04F0, IMPUTACION_PERMITIDA_04F0,
          )
          assert ANIOS_04F0 == (2022, 2023, 2024, 2025)
          assert MESES_FORMACION_VOL_04F0 == 3
          assert MESES_HOLD_04F0 == 1
          assert MIN_SIMBOLOS_POR_HOLD_04F0 == 100
          assert PNL_PERMITIDO_04F0 is False
          assert DESCARGAR_CONTENIDO_KLINES_PERMITIDO_04F0 is False
          assert USAR_EXCHANGE_INFO_ACTUAL_COMO_UNIVERSO_04F0 is False
          assert CREDENCIALES_PERMITIDAS_04F0 is False
          assert PAPER_OPERATIVO_PERMITIDO_04F0 is False
          assert LIVE_PERMITIDO_04F0 is False
          assert RENDER_PERMITIDO_04F0 is False
          assert DESARROLLO_2026_ABIERTO_04F0 is False
          assert IMPUTACION_PERMITIDA_04F0 is False
          print('04F-0 methodology locks OK')
          PY
          grep -q '04F-0 NO ES BACKTEST Y NO OBSERVA PnL' docs/investigacion/04F-0-low-volatility-datos.md
          grep -q 'al menos \*\*100 símbolos\*\*' docs/investigacion/04F-0-low-volatility-datos.md
          grep -q '2026 permanece cerrado' docs/investigacion/04F-0-low-volatility-datos.md

      - name: Unit tests 04F-0
        run: pytest -q tests/test_auditoria_low_vol_04f0.py

      - name: Run historical low-vol archive audit
        run: |
          python scripts/run_low_vol_audit_04f0.py
          grep -Eq 'ARCHIVO_LOW_VOL_INVENTARIO_APTO_04F0|ARCHIVO_LOW_VOL_INVENTARIO_NO_APTO_04F0' artifacts/low-vol-data-audit-04f0.json
          grep -q '"pnl_calculated": false' artifacts/low-vol-data-audit-04f0.json
          grep -q '"kline_content_downloaded": false' artifacts/low-vol-data-audit-04f0.json
          grep -q '"current_exchange_info_used_as_universe": false' artifacts/low-vol-data-audit-04f0.json
          grep -q '"credentials_used": false' artifacts/low-vol-data-audit-04f0.json
          grep -q '"development_2026_open": false' artifacts/low-vol-data-audit-04f0.json

      - name: Upload 04F-0 result
        uses: actions/upload-artifact@v4
        with:
          name: low-vol-data-audit-04f0
          path: artifacts/low-vol-data-audit-04f0.json
          retention-days: 14
