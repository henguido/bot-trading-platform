name: one-shot-test-cooperative-wait

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
          fetch-depth: 0
      - name: Patch persistence wait tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_persistencia_antes_de_esperar.py')
          s = p.read_text(encoding='utf-8')
          reps = [
            (
              '    monkeypatch.setattr(settings, "MODO_REAL", False)\n',
              '    monkeypatch.setattr(settings, "MODO_REAL", False)\n    main.stop_trading.clear()\n',
              1,
              'clear event'
            ),
            (
              '    monkeypatch.setattr(main.time, "sleep",\n                        lambda s: eventos.append(("sleep", s)))',
              '    monkeypatch.setattr(main.stop_trading, "wait",\n                        lambda s: (eventos.append(("sleep", s)), False)[1])',
              1,
              'fixture wait'
            ),
            (
              '    monkeypatch.setattr(main.time, "sleep", sleep_interrumpido)',
              '    monkeypatch.setattr(main.stop_trading, "wait", sleep_interrumpido)',
              1,
              'interrupted wait'
            ),
            (
              '                        getattr(nodo.func, "attr", None) == "sleep":',
              '                        getattr(nodo.func, "attr", None) in ("sleep", "wait"):',
              1,
              'body wait guard'
            ),
            (
              '''            elif attr == "sleep":\n                posiciones.setdefault("sleep", nodo.lineno)\n\n    assert "volcar" in posiciones, "el finally debe volcar la telemetria"\n    assert "sleep" in posiciones, "el finally debe contener la unica espera"\n    assert posiciones["volcar"] < posiciones["sleep"], (\n        "volcar() tiene que ejecutarse ANTES de la espera")''',
              '''            elif attr == "wait":\n                posiciones.setdefault("wait", nodo.lineno)\n\n    assert "volcar" in posiciones, "el finally debe volcar la telemetria"\n    assert "wait" in posiciones, "el finally debe contener la unica espera cooperativa"\n    assert posiciones["volcar"] < posiciones["wait"], (\n        "volcar() tiene que ejecutarse ANTES de la espera")''',
              1,
              'finally order'
            ),
            (
              '''    sleeps = [n for raiz in principal.finalbody for n in ast.walk(raiz)\n              if isinstance(n, ast.Call) and getattr(n.func, "attr", None) == "sleep"]\n    assert len(sleeps) == 1\n    assert ast.dump(sleeps[0].args[0]) == ast.dump(''',
              '''    waits = [n for raiz in principal.finalbody for n in ast.walk(raiz)\n             if isinstance(n, ast.Call) and getattr(n.func, "attr", None) == "wait"]\n    assert len(waits) == 1\n    assert ast.dump(waits[0].args[0]) == ast.dump(''',
              1,
              'wait time ast'
            ),
          ]
          for old, new, expected, label in reps:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, got {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-test-cooperative-wait.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_persistencia_antes_de_esperar.py .github/workflows/one-shot-test-cooperative-wait.yml
          git commit -m "test(runtime): adapta cadencia a espera cooperativa"
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper
