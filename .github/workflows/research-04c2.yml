name: research-04c2

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/protocolo_carry_04c2.py'
      - 'backend/economia/carry_perpetual_04c2.py'
      - 'scripts/run_carry_perpetual_04c2.py'
      - 'tests/test_carry_perpetual_04c2.py'
      - 'docs/investigacion/04C-2-perpetual-funding-carry.md'
      - '.github/workflows/research-04c2.yml'

permissions:
  contents: read

concurrency:
  group: research-04c2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perpetual-carry-04c2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ''
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      SECRET_KEY: ci-research-only-synthetic-key-04c2
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Assert 04C-2 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from backend.economia.protocolo_carry_04c2 import (
              SIMBOLOS_04C2, ANIOS_04C2, DRAG_ANUAL_NOTIONAL_04C2,
              MEDIA_ANUAL_COMMITTED_PROD_MIN_04C2, PEOR_ANIO_COMMITTED_PROD_MIN_04C2,
              SHARPE_PROD_MIN_04C2, MAX_DRAWDOWN_PROD_04C2,
              DESARROLLO_2026_ABIERTO_04C2, IMPUTACION_PERMITIDA_04C2,
              LEVERAGE_ADICIONAL_PERMITIDO_04C2, FUNDING_POSITIVO_COMO_FILTRO_04C2,
          )
          assert SIMBOLOS_04C2 == ('BTCUSDT', 'ETHUSDT')
          assert ANIOS_04C2 == (2022, 2023, 2024, 2025)
          assert str(DRAG_ANUAL_NOTIONAL_04C2) == '0.006'
          assert str(MEDIA_ANUAL_COMMITTED_PROD_MIN_04C2) == '0.05'
          assert str(PEOR_ANIO_COMMITTED_PROD_MIN_04C2) == '0.02'
          assert str(SHARPE_PROD_MIN_04C2) == '2.0'
          assert str(MAX_DRAWDOWN_PROD_04C2) == '0.075'
          assert DESARROLLO_2026_ABIERTO_04C2 is False
          assert IMPUTACION_PERMITIDA_04C2 is False
          assert LEVERAGE_ADICIONAL_PERMITIDO_04C2 is False
          assert FUNDING_POSITIVO_COMO_FILTRO_04C2 is False
          print('04C-2 methodology locks OK')
          PY
          grep -q 'PREDECLARADO' docs/investigacion/04C-2-perpetual-funding-carry.md
          grep -q 'no seleccionar solo periodos con funding positivo' docs/investigacion/04C-2-perpetual-funding-carry.md
          grep -q 'no 2026' docs/investigacion/04C-2-perpetual-funding-carry.md
      - name: Unit tests 04C-2
        run: pytest -q tests/test_carry_perpetual_04c2.py
      - name: Run fixed perpetual funding carry replication
        run: python scripts/run_carry_perpetual_04c2.py
      - name: Upload 04C-2 result
        uses: actions/upload-artifact@v4
        with:
          name: carry-perpetual-04c2-2022-2025
          path: artifacts/carry-perpetual-04c2-2022-2025.json
          if-no-files-found: error
          retention-days: 14
