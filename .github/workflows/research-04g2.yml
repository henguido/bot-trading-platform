name: research-04g2

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/protocolo_consensus_orderflow_04g2.py'
      - 'backend/economia/consensus_orderflow_04g2.py'
      - 'scripts/run_consensus_orderflow_04g2.py'
      - 'tests/test_consensus_orderflow_04g2.py'
      - 'docs/investigacion/04G-2-consensus-orderflow-sgb.md'
      - '.github/workflows/research-04g2.yml'

permissions:
  contents: read

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ''
  BINANCE_API_KEY: ''
  BINANCE_API_SECRET: ''
  SECRET_KEY: ci-research-only-synthetic-key-04g2

jobs:
  consensus-orderflow-sgb-04g2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
          pip install scikit-learn==1.9.0

      - name: Assert 04G-2 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          import sklearn
          from decimal import Decimal
          from backend.economia.protocolo_consensus_orderflow_04g2 import *
          assert sklearn.__version__ == SKLEARN_VERSION_04G2 == '1.9.0'
          assert len(BASES_04G2) == 20
          assert len(QUOTES_04G2) == 14
          assert FEATURES_04G2 == ('consensus_of','usdt_of','lag_return')
          assert MIN_QUOTES_CONSENSUS_04G2 == 2
          assert LOSS_04G2 == 'huber'
          assert SUBSAMPLE_04G2 == Decimal('0.50')
          assert GRID_N_ESTIMATORS_04G2 == (100,200)
          assert GRID_LEARNING_RATE_04G2 == (Decimal('0.03'),Decimal('0.10'))
          assert GRID_MAX_DEPTH_04G2 == (1,2)
          assert COSTE_PRIMARIO_BPS_04G2 == Decimal('25')
          assert COSTE_STRESS_BPS_04G2 == Decimal('50')
          assert FRACCION_TOP_04G2 == Decimal('0.20')
          assert MIN_ACTIVOS_POR_DIA_04G2 == 15
          assert DESARROLLO_2026_ABIERTO_04G2 is False
          assert CREDENCIALES_PERMITIDAS_04G2 is False
          assert PAPER_OPERATIVO_PERMITIDO_04G2 is False
          assert LIVE_PERMITIDO_04G2 is False
          assert RENDER_PERMITIDO_04G2 is False
          assert PERMITE_INVERTIR_SIGNO_POST_RESULTADO_04G2 is False
          assert PERMITE_CAMBIAR_COSTES_POST_RESULTADO_04G2 is False
          assert PERMITE_CAMBIAR_FEATURES_POST_RESULTADO_04G2 is False
          assert PERMITE_CAMBIAR_GRID_POST_RESULTADO_04G2 is False
          print('04G-2 methodology locks OK')
          PY
          grep -q '2026 permanece cerrado' docs/investigacion/04G-2-consensus-orderflow-sgb.md
          grep -q '25 bps' docs/investigacion/04G-2-consensus-orderflow-sgb.md
          grep -q '50 bps' docs/investigacion/04G-2-consensus-orderflow-sgb.md

      - name: Unit tests 04G-2
        run: pytest -q tests/test_consensus_orderflow_04g2.py

      - name: Run economic OOS 04G-2
        run: |
          python scripts/run_consensus_orderflow_04g2.py
          grep -Eq 'CONSENSUS_OF_SGB_APTO_04G2|CONSENSUS_OF_SGB_FALSADO_04G2|DATOS_INSUFICIENTES_04G2' artifacts/consensus-orderflow-sgb-04g2.json
          grep -q '"credentials_used": false' artifacts/consensus-orderflow-sgb-04g2.json
          grep -q '"paper_operational": false' artifacts/consensus-orderflow-sgb-04g2.json
          grep -q '"live_used": false' artifacts/consensus-orderflow-sgb-04g2.json
          grep -q '"render_used": false' artifacts/consensus-orderflow-sgb-04g2.json
          grep -q '"development_2026_open": false' artifacts/consensus-orderflow-sgb-04g2.json

      - name: Upload 04G-2 result
        uses: actions/upload-artifact@v4
        with:
          name: consensus-orderflow-sgb-04g2
          path: artifacts/consensus-orderflow-sgb-04g2.json
          retention-days: 14
