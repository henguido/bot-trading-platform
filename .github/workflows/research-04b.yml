name: research-04b

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-04b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ""
  INITIAL_CAPITAL_USD: "500"
  LIMITE_ASIGNACION_POR_OPERACION: "0.02"
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  SECRET_KEY: ci-research-only-synthetic-key-04b-2026

jobs:
  falsification:
    if: github.head_ref == 'agent/bot-2.0-04b1-edge-empirico'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert TEST 2026 is locked
        run: |
          python - <<'PY'
          from backend.economia.protocolo_experimento_edge import CORTE_TEST_MS
          from pathlib import Path
          src = Path('scripts/run_edge_falsacion.py').read_text(encoding='utf-8')
          assert 'CORTE_TEST_MS - 1' in src
          print(f'TEST locked from timestamp {CORTE_TEST_MS}; runner ends at TEST-1ms')
          PY

      - name: Run Phase A historical falsification
        run: python scripts/run_edge_falsacion.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-validation-2025
          path: artifacts/edge-validation-2025.json
          if-no-files-found: error
          retention-days: 7

  positioning-v21:
    if: github.head_ref == 'agent/bot-2.0-04b21-oi-taker-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert v21 methodology locks
        run: |
          python - <<'PY'
          from backend.economia.protocolo_posicionamiento_v21 import (
              DESARROLLO_2026_ABIERTO_V21,
              TEST_MAY_JUL_ABIERTO_V21,
              IMPUTACION_PERMITIDA_V21,
              PERMITE_INVERTIR_SIGNO_V21,
              PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V21,
              HURDLE_TOTAL_BPS_V21,
          )
          assert DESARROLLO_2026_ABIERTO_V21 is False
          assert TEST_MAY_JUL_ABIERTO_V21 is False
          assert IMPUTACION_PERMITIDA_V21 is False
          assert PERMITE_INVERTIR_SIGNO_V21 is False
          assert PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V21 is False
          assert str(HURDLE_TOTAL_BPS_V21) == '25'
          print('v21 locks OK')
          PY

      - name: Run offline v21 OI+taker diagnostic
        run: python scripts/run_positioning_v21_desarrollo.py

      - name: Upload v21 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positioning-v21-desarrollo-2022-2025
          path: artifacts/positioning-v21-desarrollo-2022-2025.json
          if-no-files-found: warn
          retention-days: 7

  deleveraging-v22:
    if: github.head_ref == 'agent/bot-2.0-04b22-deleveraging-rebound'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert v22 methodology locks
        run: |
          python - <<'PY'
          from backend.economia.protocolo_desapalancamiento_v22 import (
              DESARROLLO_2026_ABIERTO_V22,
              TEST_MAY_JUL_ABIERTO_V22,
              IMPUTACION_PERMITIDA_V22,
              PERMITE_INVERTIR_SIGNO_V22,
              PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V22,
              REEMPLAZO_CANDIDATOS_PERMITIDO_V22,
              HURDLE_TOTAL_BPS_V22,
              FRACCION_BOTTOM_PRECIO_V22,
              OI_CAMBIO_MAX_EXCLUSIVO_V22,
              TAKER_RATIO_MAX_EXCLUSIVO_V22,
          )
          assert DESARROLLO_2026_ABIERTO_V22 is False
          assert TEST_MAY_JUL_ABIERTO_V22 is False
          assert IMPUTACION_PERMITIDA_V22 is False
          assert PERMITE_INVERTIR_SIGNO_V22 is False
          assert PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V22 is False
          assert REEMPLAZO_CANDIDATOS_PERMITIDO_V22 is False
          assert str(HURDLE_TOTAL_BPS_V22) == '25'
          assert str(FRACCION_BOTTOM_PRECIO_V22) == '0.25'
          assert str(OI_CAMBIO_MAX_EXCLUSIVO_V22) == '0'
          assert str(TAKER_RATIO_MAX_EXCLUSIVO_V22) == '1'
          print('v22 locks OK')
          PY

      - name: Run offline v22 deleveraging rebound diagnostic
        run: python scripts/run_desapalancamiento_v22_desarrollo.py

      - name: Upload v22 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desapalancamiento-v22-desarrollo-2022-2025
          path: artifacts/desapalancamiento-v22-desarrollo-2022-2025.json
          if-no-files-found: warn
          retention-days: 7

  aggtrades-v23:
    if: github.head_ref == 'agent/bot-2.0-04b23-aggtrades-data-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert v23 inventory locks
        run: |
          python - <<'PY'
          from backend.economia.protocolo_aggtrades_v23 import (
              DESARROLLO_2026_ABIERTO_V23,
              TEST_MAY_JUL_ABIERTO_V23,
              IMPUTACION_PERMITIDA_V23,
              USA_RETORNOS_V23,
              USA_GPT_V23,
          )
          assert DESARROLLO_2026_ABIERTO_V23 is False
          assert TEST_MAY_JUL_ABIERTO_V23 is False
          assert IMPUTACION_PERMITIDA_V23 is False
          assert USA_RETORNOS_V23 is False
          assert USA_GPT_V23 is False
          print('v23 inventory locks OK')
          PY

      - name: Run offline v23 AggTrades inventory
        run: python scripts/run_aggtrades_audit_v23.py

      - name: Upload v23 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggtrades-data-audit-v23-2022-2025
          path: artifacts/aggtrades-data-audit-v23-2022-2025.json
          if-no-files-found: error
          retention-days: 7
