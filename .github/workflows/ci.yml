name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: sqlite:///./backend/app.db
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ""
  INITIAL_CAPITAL_USD: "500"
  LIMITE_ASIGNACION_POR_OPERACION: "0.02"
  SECRET_KEY: ci-only-synthetic-secret-key-bot-trading-2026

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Python test suite
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Compile backend
        run: python -m compileall backend

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Assert v20 keeps 2026 closed
        run: |
          python - <<'PY'
          from backend.economia.protocolo_posicionamiento_v20 import (
              DESARROLLO_2026_ABIERTO_V20,
              TEST_MAY_JUL_ABIERTO_V20,
          )
          assert DESARROLLO_2026_ABIERTO_V20 is False
          assert TEST_MAY_JUL_ABIERTO_V20 is False
          print("v20 locks OK")
          PY

      - name: Run offline v20 positioning data audit
        run: python scripts/run_positioning_audit_v20.py

      - name: Upload v20 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positioning-data-audit-v20-2022-2025
          path: artifacts/positioning-data-audit-v20-2022-2025.json
          if-no-files-found: warn
          retention-days: 7
