name: research-04d3

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/protocolo_capital_bound_04d3.py'
      - 'backend/economia/prueba_capital_bound_04d3.py'
      - 'scripts/run_capital_bound_04d3.py'
      - 'tests/test_prueba_capital_bound_04d3.py'
      - 'docs/investigacion/04D-3-capital-bound-proof.md'
      - '.github/workflows/research-04d3.yml'

jobs:
  capital-bound-04d3:
    if: github.head_ref == 'agent/bot-2.0-04d3-capital-bound-proof'
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ''
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      SECRET_KEY: ci-research-only-synthetic-key-04d3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Assert 04D-3 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from decimal import Decimal
          from backend.economia.protocolo_capital_bound_04d3 import (
              RETORNO_NOTIONAL_2022_04C2, PEOR_ANIO_PROD_MIN_04C2,
              CAPITAL_MINIMO_SPOT_MULTIPLO_04D3,
              LEVERAGE_ADICIONAL_PERMITIDO_04D3, EXCLUIR_2022_PERMITIDO_04D3,
              CAMBIAR_GATE_PERMITIDO_04D3, DESARROLLO_2026_ABIERTO_04D3,
              VEREDICTO_04D3,
          )
          assert RETORNO_NOTIONAL_2022_04C2 == Decimal('0.012413')
          assert PEOR_ANIO_PROD_MIN_04C2 == Decimal('0.02')
          assert CAPITAL_MINIMO_SPOT_MULTIPLO_04D3 == Decimal('1')
          assert LEVERAGE_ADICIONAL_PERMITIDO_04D3 is False
          assert EXCLUIR_2022_PERMITIDO_04D3 is False
          assert CAMBIAR_GATE_PERMITIDO_04D3 is False
          assert DESARROLLO_2026_ABIERTO_04D3 is False
          assert VEREDICTO_04D3 == 'CARRY_NO_RESCATABLE_SIN_LEVERAGE_04D3'
          print('04D-3 methodology locks OK')
          PY
      - name: Unit tests 04D-3
        run: pytest -q tests/test_prueba_capital_bound_04d3.py
      - name: Run capital-bound proof
        run: |
          python scripts/run_capital_bound_04d3.py
          grep -q 'CARRY_NO_RESCATABLE_SIN_LEVERAGE_04D3' artifacts/capital-bound-04d3.json
      - name: Upload 04D-3 proof
        uses: actions/upload-artifact@v4
        with:
          name: capital-bound-proof-04d3
          path: artifacts/capital-bound-04d3.json
          retention-days: 14
