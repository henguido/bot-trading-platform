name: one-shot-fix-04a1-guard

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
          fetch-depth: 0
      - name: Make guard independent of comments
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_fuentes_coste_04a1.py')
          s = p.read_text(encoding='utf-8')
          old = '''    bloque_scanner = main.split("# ── SCANNER DETERMINISTICO", 1)[1].split(
              "if not activos_para_gpt:", 1
          )[0]
          assert "obtener_order_book" not in bloque_scanner
          '''
          new = '''    # Delimitar por codigo ejecutable, no por comentarios: la guardia debe
              # sobrevivir refactors de documentacion sin perder su contrato.
              bloque_scanner = main.split(
                  "resumen_scanner = scanner.ResumenScanner()", 1
              )[1].split("if not activos_para_gpt:", 1)[0]
              assert "obtener_order_book" not in bloque_scanner
          '''
          if s.count(old) != 1:
              raise SystemExit(f'guard pattern count={s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-fix-04a1-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_fuentes_coste_04a1.py .github/workflows/one-shot-fix-04a1-guard.yml
          git commit -m "test(costes): desacopla guardia scanner de comentarios"
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper
