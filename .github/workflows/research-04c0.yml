name: research-04c0

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/auditoria_carry_04c0.py'
      - 'scripts/run_carry_04c0.py'
      - 'tests/test_auditoria_carry_04c0.py'
      - 'docs/investigacion/04C-0-auditoria-carry.md'
      - '.github/workflows/research-04c0.yml'

permissions:
  contents: read

concurrency:
  group: research-04c0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  carry-audit-04c0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ''
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      SECRET_KEY: ci-research-only-synthetic-key-04c0
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Assert 04C-0 safety locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          grep -q 'sin PnL en 04C-0' docs/investigacion/04C-0-auditoria-carry.md
          grep -q '2026 cerrado' docs/investigacion/04C-0-auditoria-carry.md
      - name: Unit tests 04C-0
        run: pytest -q tests/test_auditoria_carry_04c0.py
      - name: Run metadata-only carry audit
        run: python scripts/run_carry_04c0.py
      - name: Upload 04C-0 audit
        uses: actions/upload-artifact@v4
        with:
          name: carry-04c0-audit-2022-2025
          path: artifacts/carry-04c0-audit-2022-2025.json
          if-no-files-found: error
          retention-days: 14
