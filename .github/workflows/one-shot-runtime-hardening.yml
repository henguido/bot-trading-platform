name: one-shot-runtime-hardening

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
          fetch-depth: 0
      - name: Patch main safely
        shell: python
        run: |
          from pathlib import Path

          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'import sys\nimport time\nimport pytz, traceback',
                  'import sys\nimport time\nimport threading\nimport pytz, traceback',
                  'threading import',
              ),
              (
                  '''def get_min_notional(symbol, filters_dict):\n    symbol_filters = filters_dict.get(symbol)\n    if not symbol_filters:\n        return 1.0\n\n    for f in symbol_filters:\n        if f["filterType"] in ["NOTIONAL", "MIN_NOTIONAL"]:\n            return float(f.get("minNotional", 1.0))\n    return 1.0\n''',
                  '''def get_min_notional(symbol, info_por_symbol):\n    """Minimo real del exchange; None significa desconocido, nunca un default."""\n    filtros = elegibilidad.leer_filtros(info_por_symbol.get(symbol))\n    return float(filtros.min_notional) if filtros is not None else None\n''',
                  'min notional fail closed',
              ),
              (
                  'motor_riesgo = MotorRiesgo()\n',
                  'motor_riesgo = MotorRiesgo()\nstop_trading = threading.Event()\n',
                  'stop event',
              ),
              (
                  '    while True:\n        medidor = MedidorCicloHttp(nuevo_ciclo_id(), ciclo_num=ciclo)',
                  '    while not stop_trading.is_set():\n        medidor = MedidorCicloHttp(nuevo_ciclo_id(), ciclo_num=ciclo)',
                  'loop condition',
              ),
              (
                  '''                    propuesta = PropuestaOperacion(\n                        symbol=symbol, side=lado, precio=precio_actual,\n                        base_quantity_modelo=base_quantity,\n                        min_notional=get_min_notional(symbol, filters_dict),\n                    )\n''',
                  '''                    min_notional = (\n                        get_min_notional(symbol, info_por_symbol)\n                        if lado is Lado.COMPRA else 0.0\n                    )\n                    if lado is Lado.COMPRA and min_notional is None:\n                        imprimir_resistente(\n                            f"[EXCHANGE] {symbol}: filtros LOT_SIZE/NOTIONAL desconocidos; compra bloqueada")\n                        if resumen_decision_ciclo is not None:\n                            resumen_decision_ciclo.anotar_omision(\n                                "FILTROS_EXCHANGE_DESCONOCIDOS")\n                        continue\n\n                    propuesta = PropuestaOperacion(\n                        symbol=symbol, side=lado, precio=precio_actual,\n                        base_quantity_modelo=base_quantity,\n                        min_notional=min_notional,\n                    )\n''',
                  'proposal filters',
              ),
              (
                  '                time.sleep(settings.WAIT_TIME)',
                  '                stop_trading.wait(settings.WAIT_TIME)',
                  'interruptible wait',
              ),
              (
                  '''coordinador = CoordinadorTrading(\n    objetivo=trading_loop,\n    candado=candado_por_defecto(settings.DATABASE_URL),\n    precondiciones=(_precondicion_esquema,),\n)''',
                  '''coordinador = CoordinadorTrading(\n    objetivo=trading_loop,\n    candado=candado_por_defecto(settings.DATABASE_URL),\n    precondiciones=(_precondicion_esquema,),\n    stop_event=stop_trading,\n)''',
                  'coordinator stop event',
              ),
          ]

          for old, new, label in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit and remove helper
        run: |
          rm .github/workflows/one-shot-runtime-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py .github/workflows/one-shot-runtime-hardening.yml
          git commit -m "fix(runtime): hace shutdown cooperativo y filtros fail-closed"
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper
