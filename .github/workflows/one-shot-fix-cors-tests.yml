name: one-shot-fix-cors-tests

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper

      - name: Patch CORS production contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {n}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "tests/test_configuracion.py",
              '                            "OPENAI_MODEL", "ACCESS_TOKEN_EXPIRE_MINUTES",\n                            "PERMITIR_BD_REMOTA_EN_DESARROLLO")}',
              '                            "OPENAI_MODEL", "ACCESS_TOKEN_EXPIRE_MINUTES",\n                            "PERMITIR_BD_REMOTA_EN_DESARROLLO", "CORS_ORIGINS")}',
          )

          replace_exact(
              "tests/test_configuracion.py",
              'def test_production_con_database_url_arranca():\n    code, out, err = importar({"APP_ENV": "production", "DATABASE_URL": BD_REMOTA})\n    assert code == 0, err\n    assert "IMPORT_OK" in out\n',
              'def test_production_con_database_url_arranca():\n    code, out, err = importar({\n        "APP_ENV": "production",\n        "DATABASE_URL": BD_REMOTA,\n        "CORS_ORIGINS": "https://frontend.test.invalid",\n    })\n    assert code == 0, err\n    assert "IMPORT_OK" in out\n\n\ndef test_production_sin_cors_origins_falla_seguro():\n    code, out, err = importar({\n        "APP_ENV": "production",\n        "DATABASE_URL": BD_REMOTA,\n    })\n    assert code != 0\n    assert "IMPORT_OK" not in out\n    assert "CORS_ORIGINS" in err\n\n\ndef test_cors_wildcard_se_rechaza():\n    code, out, err = importar({\n        "APP_ENV": "production",\n        "DATABASE_URL": BD_REMOTA,\n        "CORS_ORIGINS": "*",\n    })\n    assert code != 0\n    assert "IMPORT_OK" not in out\n    assert "CORS_ORIGINS" in err and "no admite *" in err\n\n\ndef test_cors_multiples_origenes_se_parsean():\n    code, out, err = importar({\n        "APP_ENV": "production",\n        "DATABASE_URL": BD_REMOTA,\n        "CORS_ORIGINS": "https://uno.test.invalid, https://dos.test.invalid",\n    }, extra="print(\'CORS\', s.CORS_ORIGINS)")\n    assert code == 0, err\n    assert "https://uno.test.invalid" in out\n    assert "https://dos.test.invalid" in out\n',
          )

          replace_exact(
              "tests/test_env_canonico.py",
              '        "INITIAL_CAPITAL_USD": "321",\n',
              '        "INITIAL_CAPITAL_USD": "321",\n        "CORS_ORIGINS": "https://frontend.test.invalid",\n',
          )
          PY

          git diff --check
          git rm .github/workflows/one-shot-fix-cors-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_configuracion.py tests/test_env_canonico.py
          git commit -m "test(config): actualiza contrato CORS de produccion"
          git push
