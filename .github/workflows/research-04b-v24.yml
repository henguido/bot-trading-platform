name: research-04b-v24

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-04b-v24-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ""
  INITIAL_CAPITAL_USD: "500"
  LIMITE_ASIGNACION_POR_OPERACION: "0.02"
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  SECRET_KEY: ci-research-only-synthetic-key-04b-v24

jobs:
  orderflow-residual-v24:
    if: github.head_ref == 'agent/bot-2.0-04b24-orderflow-residual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert v24 methodology locks
        run: |
          python - <<'PY'
          from backend.economia.protocolo_orderflow_v24 import (
              DESARROLLO_2026_ABIERTO_V24,
              TEST_MAY_JUL_ABIERTO_V24,
              IMPUTACION_PERMITIDA_V24,
              PERMITE_INVERTIR_SIGNO_V24,
              PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V24,
              PERMITE_CAMBIAR_FECHAS_POST_RESULTADO_V24,
              PERMITE_CAMBIAR_HORIZONTE_POST_RESULTADO_V24,
              FRACCION_TOP_RESIDUAL_V24,
              HORIZONTE_RETORNO_DIAS_V24,
              HURDLE_TOTAL_BPS_V24,
              MIN_SIMBOLOS_POR_TIMESTAMP_V24,
              N_FECHAS_FEATURE_V24,
              USA_FUTURES_V24,
              USA_OI_V24,
              USA_FUNDING_V24,
              USA_GPT_V24,
          )
          assert DESARROLLO_2026_ABIERTO_V24 is False
          assert TEST_MAY_JUL_ABIERTO_V24 is False
          assert IMPUTACION_PERMITIDA_V24 is False
          assert PERMITE_INVERTIR_SIGNO_V24 is False
          assert PERMITE_AJUSTAR_UMBRALES_POST_RESULTADO_V24 is False
          assert PERMITE_CAMBIAR_FECHAS_POST_RESULTADO_V24 is False
          assert PERMITE_CAMBIAR_HORIZONTE_POST_RESULTADO_V24 is False
          assert str(FRACCION_TOP_RESIDUAL_V24) == '0.25'
          assert HORIZONTE_RETORNO_DIAS_V24 == 7
          assert str(HURDLE_TOTAL_BPS_V24) == '25'
          assert MIN_SIMBOLOS_POR_TIMESTAMP_V24 == 15
          assert N_FECHAS_FEATURE_V24 == 96
          assert USA_FUTURES_V24 is False
          assert USA_OI_V24 is False
          assert USA_FUNDING_V24 is False
          assert USA_GPT_V24 is False
          print('v24 methodology locks OK')
          PY

      - name: Run v24 residual order-flow diagnostic
        run: python scripts/run_orderflow_v24_desarrollo.py

      - name: Upload v24 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-v24-desarrollo-2022-2025
          path: artifacts/orderflow-v24-desarrollo-2022-2025.json
          if-no-files-found: warn
          retention-days: 7
