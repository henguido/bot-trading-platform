name: one-shot-pytest-diagnose

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./backend/app.db
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ""
      INITIAL_CAPITAL_USD: "500"
      LIMITE_ASIGNACION_POR_OPERACION: "0.02"
      SECRET_KEY: ci-only-synthetic-secret-key-bot-trading-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Locate slow/hanging test
        run: |
          set -o pipefail
          timeout 120s pytest -vv -x 2>&1 | tee pytest-diagnose.txt
      - name: Remove helper
        if: always()
        run: |
          rm -f .github/workflows/one-shot-pytest-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-pytest-diagnose.yml
          git commit -m "chore(ci): retira diagnostico pytest temporal" || true
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper || true
