name: research-04g1a
on:
  pull_request:
    paths:
      - 'backend/economia/protocolo_orderflow_matrix_04g1a.py'
      - 'backend/economia/auditoria_orderflow_matrix_04g1a.py'
      - 'scripts/run_orderflow_matrix_04g1a.py'
      - 'tests/test_auditoria_orderflow_matrix_04g1a.py'
      - 'docs/investigacion/04G-1a-matriz-fija-orderflow.md'
      - '.github/workflows/research-04g1a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orderflow-fixed-matrix-04g1a:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ENV: test
      TRADING_MODE: PAPER
      ALLOW_LIVE_TRADING: ''
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      SECRET_KEY: ci-research-only-synthetic-key-04g1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Assert 04G-1a locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from decimal import Decimal
          from backend.economia.protocolo_orderflow_matrix_04g1a import *
          assert CORE_QUOTES_04G1A == ('USDT','EUR','BRL','TRY','UAH')
          assert N_FEATURES_OF_04G1A == 5
          assert MIN_BASES_COMPLETE_DIA_04G1A == 10
          assert FRACCION_DIAS_USABLES_TOTAL_MIN_04G1A == Decimal('0.95')
          assert FRACCION_DIAS_USABLES_POR_ANIO_MIN_04G1A == Decimal('0.90')
          assert IMPUTACION_PERMITIDA_04G1A is False
          assert RETORNO_FUTURO_PERMITIDO_04G1A is False
          assert ML_PERMITIDO_04G1A is False
          assert PNL_PERMITIDO_04G1A is False
          assert SELECCION_QUOTE_POR_PERFORMANCE_PERMITIDA_04G1A is False
          assert CREDENCIALES_PERMITIDAS_04G1A is False
          assert PAPER_OPERATIVO_PERMITIDO_04G1A is False
          assert LIVE_PERMITIDO_04G1A is False
          assert RENDER_PERMITIDO_04G1A is False
          assert DESARROLLO_2026_ABIERTO_04G1A is False
          print('04G-1a methodology locks OK')
          PY
          grep -q 'USDT, EUR, BRL, TRY, UAH' docs/investigacion/04G-1a-matriz-fija-orderflow.md
          grep -q 'al menos \*\*10 bases complete-case por día\*\*' docs/investigacion/04G-1a-matriz-fija-orderflow.md
      - name: Unit tests 04G-1a
        run: pytest -q tests/test_auditoria_orderflow_matrix_04g1a.py
      - name: Run fixed matrix audit
        run: |
          python scripts/run_orderflow_matrix_04g1a.py
          grep -Eq 'MATRIZ_OF_FIJA_APTA_04G1A|MATRIZ_OF_FIJA_NO_APTA_04G1A' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"future_return_calculated": false' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"ml_trained": false' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"pnl_calculated": false' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"quote_selected_by_performance": false' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"imputation_used": false' artifacts/orderflow-fixed-matrix-04g1a.json
          grep -q '"development_2026_open": false' artifacts/orderflow-fixed-matrix-04g1a.json
      - name: Upload 04G-1a result
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-fixed-matrix-04g1a
          path: artifacts/orderflow-fixed-matrix-04g1a.json
          retention-days: 14
