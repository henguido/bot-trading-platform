name: one-shot-fix-scanner-decision-test

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper

      - name: Update scanner order guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_scanner.py")
          text = p.read_text(encoding="utf-8")
          old = '    pos_llm = fuente.index("openai.analyze_multiple_assets(")\n    assert pos_gate < pos_scanner < pos_llm, (\n        "la cadena debe ser Eligibility Gate -> scanner -> LLM")'
          new = '    pos_decision = fuente.index("decision_engine.decidir(")\n    assert pos_gate < pos_scanner < pos_decision, (\n        "la cadena debe ser Eligibility Gate -> scanner -> motor de decision")'
          if text.count(old) != 1:
              raise SystemExit(f"expected one scanner guard, got {text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git rm .github/workflows/one-shot-fix-scanner-decision-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_scanner.py
          git commit -m "test(scanner): actualiza orden al motor de decision"
          git push
