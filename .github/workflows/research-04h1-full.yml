name: research-04h1-full

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/economia/protocolo_crossvenue_carry_04h1.py'
      - 'backend/economia/fuente_0xarchive_04h1.py'
      - 'backend/economia/carry_crossvenue_04h1.py'
      - 'tests/test_protocolo_crossvenue_carry_04h1.py'
      - 'tests/test_fuente_0xarchive_04h1.py'
      - 'tests/test_carry_crossvenue_04h1.py'
      - 'scripts/run_crossvenue_carry_04h1.py'
      - '.github/workflows/research-04h1-full.yml'

permissions:
  contents: read

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ''
  BINANCE_API_KEY: ''
  BINANCE_API_SECRET: ''
  SECRET_KEY: ci-research-only-synthetic-key-04h1-full
  OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}

jobs:
  full-crossvenue-falsification-04h1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert 04H-1 locks
        run: |
          test -n "$OXARCHIVE_API_KEY"
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from backend.economia.protocolo_crossvenue_carry_04h1 import *
          assert ACTIVOS_04H1 == ('BTC','ETH','SOL')
          assert ANIOS_04H1 == (2024,2025)
          assert DIRECCION_04H1 == 'LONG_BINANCE_SHORT_HYPERLIQUID'
          assert LEVERAGE_POR_PATA_04H1 == 2
          assert COSTE_PRIMARIO_BPS_ANUAL_04H1 == 60
          assert COSTE_STRESS_BPS_ANUAL_04H1 == 120
          assert HAC_LAG_DIAS_04H1 == 7
          assert MIN_ACTIVOS_POSITIVOS_POR_ANIO_04H1 == 2
          assert CALCULAR_PNL_SI_GATE_COMPLETO_PASA_04H1 is True
          assert CALCULAR_PNL_SIN_GATE_PERMITIDO_04H1 is False
          assert CREDENCIALES_TRADING_PERMITIDAS_04H1 is False
          assert PAPER_OPERATIVO_PERMITIDO_04H1 is False
          assert LIVE_PERMITIDO_04H1 is False
          assert RENDER_PERMITIDO_04H1 is False
          assert DESARROLLO_2026_ABIERTO_04H1 is False
          print('04H-1 full methodology locks OK')
          PY

      - name: Unit tests 04H-1
        run: pytest -q tests/test_protocolo_crossvenue_carry_04h1.py tests/test_fuente_0xarchive_04h1.py tests/test_carry_crossvenue_04h1.py

      - name: Run full 2024-2025 falsification
        run: python scripts/run_crossvenue_carry_04h1.py

      - name: Upload 04H-1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossvenue-carry-04h1
          path: artifacts/crossvenue-carry-04h1.json
          if-no-files-found: warn
          retention-days: 14
