name: research-05-prospective

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: "Ref del código de research a ejecutar; vacío usa el SHA del evento."
        required: false
        type: string
        default: ""
      seed_run_id:
        description: "Run previo usado solo para sembrar estado si el cache de la rama está vacío."
        required: false
        type: string
        default: ""
  schedule:
    # Este cron solo entra en vigor cuando el workflow existe en la rama por defecto.
    - cron: "17 */4 * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/research-05-prospective.yml"
      - "backend/economia/fee_verificada.py"
      - "scripts/shadow_scanner_unified_05i.py"
      - "scripts/analyze_scanner_challenger_05j.py"
      - "scripts/shadow_strategy_execution_05k.py"
      - "scripts/status_research_05.py"
      - "scripts/verdict_research_05.py"
      - "tests/test_fee_verificada_05k.py"
      - "tests/test_research_05_workflow.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: research-05-prospective-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ""
  INITIAL_CAPITAL_USD: "500"
  LIMITE_ASIGNACION_POR_OPERACION: "0.02"
  BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
  BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
  SECRET_KEY: research-05-only-synthetic-secret-key-2026
  RESEARCH_TAKER_FEE_BPS: "10.0"
  RESEARCH_TAKER_FEE_SOURCE: "manual:binance_account.commissionRates.taker"
  RESEARCH_TAKER_FEE_VERIFIED_AT: "2026-09-04T18:47:00Z"

jobs:
  prospective-shadow:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/bot-2.0-05a-profitability-paper'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Fail closed unless PAPER baseline is safe
        shell: bash
        run: |
          set -euo pipefail
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          test "$INITIAL_CAPITAL_USD" = "500"
          test "$LIMITE_ASIGNACION_POR_OPERACION" = "0.02"

      - name: Report fee source availability
        shell: bash
        run: |
          if [ -n "$BINANCE_API_KEY" ] && [ -n "$BINANCE_API_SECRET" ]; then
            echo "fee_source=BINANCE_ACCOUNT_AVAILABLE"
          elif [ -n "$RESEARCH_TAKER_FEE_BPS" ] && [ -n "$RESEARCH_TAKER_FEE_SOURCE" ] && [ -n "$RESEARCH_TAKER_FEE_VERIFIED_AT" ]; then
            echo "fee_source=MANUAL_VERIFIED_CANDIDATE"
            echo "La validez temporal se verifica fail-closed dentro de Python."
          else
            echo "fee_source=NO_DISPONIBLE"
            echo "05I/05J continuaran con evidencia publica; 05K debe permanecer sin ejecucion neta cuando la fee sea desconocida."
          fi

      - name: Restore cumulative shadow state
        id: restore-shadow
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/scanner-unified-shadow-05i-state.json
            artifacts/strategy-execution-shadow-05k-state.json
          key: research-05-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            research-05-state-

      - name: Detect restored shadow state
        id: shadow-state
        shell: bash
        run: |
          if [ -s artifacts/scanner-unified-shadow-05i-state.json ] && [ -s artifacts/strategy-execution-shadow-05k-state.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap state from prior evidence
        if: steps.shadow-state.outputs.available != 'true' && inputs.seed_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: research-05-${{ inputs.seed_run_id }}
          path: artifacts
          run-id: ${{ inputs.seed_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run 05I unified scanner shadow
        run: python scripts/shadow_scanner_unified_05i.py

      - name: Analyze 05J OOS challenger
        run: python scripts/analyze_scanner_challenger_05j.py

      - name: Run 05K prospective execution shadow
        run: python scripts/shadow_strategy_execution_05k.py

      - name: Export compact research status
        run: python scripts/status_research_05.py | tee artifacts/research-05-status.txt

      - name: Export statistical research verdict
        run: python scripts/verdict_research_05.py | tee artifacts/research-05-verdict.json

      - name: Save cumulative shadow state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/scanner-unified-shadow-05i-state.json
            artifacts/strategy-execution-shadow-05k-state.json
          key: research-05-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-05-${{ github.run_id }}
          path: |
            artifacts/scanner-unified-shadow-05i-state.json
            artifacts/scanner-unified-shadow-05i-summary.json
            artifacts/scanner-challenger-05j.json
            artifacts/strategy-execution-shadow-05k-state.json
            artifacts/strategy-execution-shadow-05k-summary.json
            artifacts/research-05-status.txt
            artifacts/research-05-verdict.json
          if-no-files-found: warn
          retention-days: 30
