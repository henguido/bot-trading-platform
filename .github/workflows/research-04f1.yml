name: research-04f1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/economia/protocolo_low_vol_04f1.py'
      - 'backend/economia/auditoria_low_vol_04f1.py'
      - 'scripts/run_low_vol_content_audit_04f1.py'
      - 'tests/test_auditoria_low_vol_04f1.py'
      - 'docs/investigacion/04F-1-low-volatility-contenido.md'
      - '.github/workflows/research-04f1.yml'

permissions:
  contents: read

env:
  APP_ENV: test
  TRADING_MODE: PAPER
  ALLOW_LIVE_TRADING: ''
  BINANCE_API_KEY: ''
  BINANCE_API_SECRET: ''
  SECRET_KEY: ci-research-only-synthetic-key-04f1

jobs:
  low-vol-content-04f1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Assert 04F-1 methodology locks
        run: |
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test "$TRADING_MODE" = "PAPER"
          test -z "$ALLOW_LIVE_TRADING"
          python - <<'PY'
          from decimal import Decimal
          from backend.economia.protocolo_low_vol_04f1 import (
              ANIOS_04F1, MESES_FORMACION_VOL_04F1, MESES_HOLD_04F1,
              COBERTURA_FORMACION_MIN_04F1, DIAS_LIQUIDEZ_VALIDOS_MIN_04F1,
              MEDIANA_QUOTE_VOLUME_30D_MIN_04F1, MIN_SIMBOLOS_ELEGIBLES_POR_HOLD_04F1,
              PNL_PERMITIDO_04F1, VOLATILIDAD_CALCULADA_PERMITIDA_04F1,
              RANKING_LOW_VOL_PERMITIDO_04F1, RETORNO_FUTURO_PERMITIDO_04F1,
              USAR_EXCHANGE_INFO_ACTUAL_COMO_UNIVERSO_04F1,
              CREDENCIALES_PERMITIDAS_04F1, IMPUTACION_PERMITIDA_04F1,
              PAPER_OPERATIVO_PERMITIDO_04F1, LIVE_PERMITIDO_04F1,
              RENDER_PERMITIDO_04F1, DESARROLLO_2026_ABIERTO_04F1,
          )
          assert ANIOS_04F1 == (2022, 2023, 2024, 2025)
          assert MESES_FORMACION_VOL_04F1 == 3
          assert MESES_HOLD_04F1 == 1
          assert COBERTURA_FORMACION_MIN_04F1 == Decimal('0.95')
          assert DIAS_LIQUIDEZ_VALIDOS_MIN_04F1 == 27
          assert MEDIANA_QUOTE_VOLUME_30D_MIN_04F1 == Decimal('5000000')
          assert MIN_SIMBOLOS_ELEGIBLES_POR_HOLD_04F1 == 50
          assert PNL_PERMITIDO_04F1 is False
          assert VOLATILIDAD_CALCULADA_PERMITIDA_04F1 is False
          assert RANKING_LOW_VOL_PERMITIDO_04F1 is False
          assert RETORNO_FUTURO_PERMITIDO_04F1 is False
          assert USAR_EXCHANGE_INFO_ACTUAL_COMO_UNIVERSO_04F1 is False
          assert CREDENCIALES_PERMITIDAS_04F1 is False
          assert IMPUTACION_PERMITIDA_04F1 is False
          assert PAPER_OPERATIVO_PERMITIDO_04F1 is False
          assert LIVE_PERMITIDO_04F1 is False
          assert RENDER_PERMITIDO_04F1 is False
          assert DESARROLLO_2026_ABIERTO_04F1 is False
          print('04F-1 methodology locks OK')
          PY
          grep -q '04F-1 NO CALCULA VOLATILIDAD, RANKING LOW-VOL, RETORNO FUTURO NI PnL' docs/investigacion/04F-1-low-volatility-contenido.md
          grep -q 'mediana de `quote_volume` diaria ≥ \*\*5.000.000 USDT\*\*' docs/investigacion/04F-1-low-volatility-contenido.md
          grep -q 'al menos \*\*50 activos elegibles\*\*' docs/investigacion/04F-1-low-volatility-contenido.md

      - name: Unit tests 04F-1
        run: pytest -q tests/test_auditoria_low_vol_04f1.py

      - name: Run low-vol content and eligibility audit
        run: |
          python scripts/run_low_vol_content_audit_04f1.py
          grep -Eq 'DATASET_LOW_VOL_ELEGIBILIDAD_APTO_04F1|DATASET_LOW_VOL_ELEGIBILIDAD_NO_APTO_04F1' artifacts/low-vol-content-audit-04f1.json
          grep -q '"volatility_calculated": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"low_vol_ranking_calculated": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"future_return_calculated": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"pnl_calculated": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"current_exchange_info_used_as_universe": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"credentials_used": false' artifacts/low-vol-content-audit-04f1.json
          grep -q '"development_2026_open": false' artifacts/low-vol-content-audit-04f1.json

      - name: Upload 04F-1 result
        uses: actions/upload-artifact@v4
        with:
          name: low-vol-content-audit-04f1
          path: artifacts/low-vol-content-audit-04f1.json
          retention-days: 14
