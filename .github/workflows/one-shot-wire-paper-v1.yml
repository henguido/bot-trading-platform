name: one-shot-wire-paper-v1

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper
    paths:
      - .github/workflows/one-shot-wire-paper-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
      - name: Wire persistent PAPER dependencies into main
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              text = text.replace(old, new, 1)

          replace_once(
              'from backend import scanner\n',
              'from backend import scanner\nfrom backend.economia.profundidad import obtener_order_book\n',
              'import profundidad',
          )

          old_assets = (
              '                assets_disponibles, balances_reales, symbols_info = get_available_assets(\n'
              '                    medidor=medidor)'
          )
          new_assets = (
              '                # Reutiliza el MISMO GET /account que ya obtiene balances para\n'
              '                # extraer la fee taker. No añade una peticion al ciclo.\n'
              '                resultado_assets = get_available_assets(\n'
              '                    medidor=medidor, incluir_costes_cuenta=True)\n'
              '                assets_disponibles, balances_reales, symbols_info, costes_cuenta = resultado_assets'
          )
          replace_once(old_assets, new_assets, 'assets con costes')

          old_usdt = '                usdt_broker=saldo_real_dict.get("USDT", 0.0),\n'
          new_usdt = (
              '                usdt_broker=saldo_real_dict.get("USDT", 0.0),\n'
              '                session_factory=SessionLocal,\n'
              '                paper_initial_capital_usd=settings.INITIAL_CAPITAL_USD,\n'
              '                paper_fee_taker_bps_por_lado=costes_cuenta.get(\n'
              '                    "fee_taker_bps_por_lado"),\n'
              '                paper_order_book_provider=(\n'
              '                    None if settings.MODO_REAL else\n'
              '                    lambda symbol: obtener_order_book(\n'
              '                        binance, symbol, limit=20,\n'
              '                        medicion=medidor.operacion(\n'
              '                            "binance", "paper_order_book"),\n'
              '                    )\n'
              '                ),\n'
          )
          replace_once(old_usdt, new_usdt, 'dependencias PAPER')

          old_comment = (
              '                # activa. En PAPER, exclusivamente del Simulator; en LIVE,\n'
              '                # saldo broker + contexto persistente. El bucle no mezcla.\n'
          )
          new_comment = (
              '                # activa. En PAPER, exclusivamente del ledger persistente;\n'
              '                # en LIVE, saldo broker + contexto persistente. El bucle no mezcla.\n'
          )
          replace_once(old_comment, new_comment, 'comentario fuente PAPER')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove helper and commit exact patch
        shell: bash
        run: |
          rm .github/workflows/one-shot-wire-paper-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py .github/workflows/one-shot-wire-paper-v1.yml
          git diff --cached --check
          git commit -m "feat(paper): cablea fee y profundidad al ciclo"
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper
