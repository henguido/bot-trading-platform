name: one-shot-paper-assets-compat

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper
    paths:
      - .github/workflows/one-shot-paper-assets-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper
      - name: Apply exact adapter patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              text = text.replace(old, new, 1)

          anchor = '# Lógica principal del bot\ndef trading_loop():\n'
          helper = '''def _obtener_assets_con_costes(*, medidor=None):
              """Normaliza la transición 3->4 valores sin inventar costes.

              Producción soporta ``incluir_costes_cuenta=True`` y obtiene la fee
              del mismo GET /account usado para balances. Dobles/adaptadores legacy
              pueden seguir devolviendo tres valores; en ese caso la fee queda
              explícitamente desconocida y PAPER falla cerrado si intentara operar.
              """
              try:
                  resultado = get_available_assets(
                      medidor=medidor, incluir_costes_cuenta=True)
              except TypeError as e:
                  if "incluir_costes_cuenta" not in str(e):
                      raise
                  resultado = get_available_assets(medidor=medidor)

              if len(resultado) == 4:
                  return resultado
              if len(resultado) == 3:
                  assets, balances, symbols_info = resultado
                  return assets, balances, symbols_info, {
                      "fee_taker_bps_por_lado": None,
                      "fee_maker_bps_por_lado": None,
                      "fuente_fee": "NO_DISPONIBLE",
                      "fuente_fee_maker": "NO_DISPONIBLE",
                  }
              raise ValueError(
                  f"get_available_assets devolvio {len(resultado)} elementos; se esperaban 3 o 4"
              )


# Lógica principal del bot
def trading_loop():
'''
          replace_once(anchor, helper, 'insercion adaptador')

          old = (
              '                # Reutiliza el MISMO GET /account que ya obtiene balances para\n'
              '                # extraer la fee taker. No añade una peticion al ciclo.\n'
              '                resultado_assets = get_available_assets(\n'
              '                    medidor=medidor, incluir_costes_cuenta=True)\n'
              '                assets_disponibles, balances_reales, symbols_info, costes_cuenta = resultado_assets'
          )
          new = (
              '                # Reutiliza el MISMO GET /account que ya obtiene balances.\n'
              '                # El adaptador conserva dobles legacy sin convertir desconocido en cero.\n'
              '                (assets_disponibles, balances_reales, symbols_info,\n'
              '                 costes_cuenta) = _obtener_assets_con_costes(medidor=medidor)'
          )
          replace_once(old, new, 'uso adaptador')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-paper-assets-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py .github/workflows/one-shot-paper-assets-compat.yml
          git diff --cached --check
          git commit -m "fix(paper): adapta costes de cuenta sin asumir fee cero"
          git push origin HEAD:agent/bot-2.0-05a-profitability-paper
