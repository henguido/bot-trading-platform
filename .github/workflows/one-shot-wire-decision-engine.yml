name: one-shot-wire-decision-engine

on:
  push:
    branches:
      - agent/bot-2.0-05a-profitability-paper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bot-2.0-05a-profitability-paper

      - name: Wire decision engine
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {n}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "backend/config/settings.py",
              "OPENAI_MODEL = os.getenv('OPENAI_MODEL', 'gpt-4o-2024-08-06').strip() or 'gpt-4o-2024-08-06'",
              "OPENAI_MODEL = os.getenv('OPENAI_MODEL', 'gpt-4o-2024-08-06').strip() or 'gpt-4o-2024-08-06'\n\n# Motor que genera decisiones. GPT conserva el comportamiento historico;\n# SAFE_NO_TRADE mantiene el proceso operativo sin llamar IA ni abrir compras.\n# El futuro motor determinista se añadira como opcion solo tras validacion OOS.\nDECISION_ENGINES_VALIDOS = ('GPT', 'SAFE_NO_TRADE')\nDECISION_ENGINE = os.getenv('DECISION_ENGINE', 'GPT').strip().upper() or 'GPT'\nif DECISION_ENGINE not in DECISION_ENGINES_VALIDOS:\n    raise RuntimeError(\n        f\"DECISION_ENGINE={DECISION_ENGINE!r} no es valido. Usa uno de: \"\n        f\"{', '.join(DECISION_ENGINES_VALIDOS)}\")",
          )

          replace_exact(
              ".env.example",
              "OPENAI_API_KEY=\n",
              "OPENAI_API_KEY=\n# GPT (compatibilidad actual) | SAFE_NO_TRADE (sin llamadas IA ni compras nuevas)\nDECISION_ENGINE=GPT\n",
          )

          replace_exact(
              "backend/main.py",
              "from backend import scanner",
              "from backend import scanner, decision_engine",
          )

          replace_exact(
              "backend/main.py",
              '            print(f"🎯 Enviando {len(activos_para_gpt)} activos a GPT para análisis")',
              '            print(f"🎯 Enviando {len(activos_para_gpt)} activos al motor {settings.DECISION_ENGINE}")',
          )

          old = "\n".join([
              "            medidor.marcar_fase_pre_llm(len(activos_para_gpt))",
              "",
              "            resultados, explicacion_gpt = openai.analyze_multiple_assets(",
              "                activos_para_gpt,",
              "                usdt_disponible,",
              "                sentimiento,",
              "                noticias_str,",
              "                portafolio_contexto,",
              "                market_pairs_filtrados,",
              "                ciclo=ciclo,   # solo telemetria: permite agregar por ciclo",
              "                ciclo_id=medidor.ciclo_id,   # solo telemetria: correlacion HTTP",
              "            )",
          ])
          new = "\n".join([
              "            if settings.DECISION_ENGINE == decision_engine.ENGINE_GPT:",
              "                medidor.marcar_fase_pre_llm(len(activos_para_gpt))",
              "",
              "            resultados, explicacion_gpt = decision_engine.decidir(",
              "                settings.DECISION_ENGINE,",
              "                openai=openai,",
              "                activos=activos_para_gpt,",
              "                usdt_disponible=usdt_disponible,",
              "                sentimiento=sentimiento,",
              "                noticias_str=noticias_str,",
              "                portafolio_contexto=portafolio_contexto,",
              "                market_pairs_filtrados=market_pairs_filtrados,",
              "                ciclo=ciclo,",
              "                ciclo_id=medidor.ciclo_id,",
              "            )",
          ])
          replace_exact("backend/main.py", old, new)
          PY

          git diff --check
          git rm .github/workflows/one-shot-wire-decision-engine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/config/settings.py backend/main.py .env.example
          git commit -m "refactor(core): desacopla decisiones de GPT"
          git push
